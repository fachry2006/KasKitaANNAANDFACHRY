<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOKO GETOL NATARU PERIODE 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between max-w-md mx-auto border-x border-slate-200 shadow-xl">

    <!-- Header Mobile Optimized -->
    <header class="bg-gradient-to-r from-blue-700 via-indigo-700 to-blue-800 text-white shadow-md sticky top-0 z-50">
        <div class="px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="bg-white/15 p-2 rounded-xl backdrop-blur-md shrink-0">
                    <i class="fa-solid fa-store-check text-lg text-amber-300"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-sm uppercase tracking-wide text-white leading-tight">TOKO GETOL NATARU</h1>
                    <p class="text-[10px] text-blue-200 font-semibold tracking-wider uppercase">PERIODE 2026</p>
                </div>
            </div>
            
            <button id="resetProfileBtn" onclick="resetUserSelection()" class="hidden text-[11px] bg-red-500/20 hover:bg-red-500/30 text-white px-2.5 py-1.5 rounded-lg border border-white/20 transition-all flex items-center gap-1 font-medium">
                <i class="fa-solid fa-arrow-left text-[10px]"></i>
                <span>Ganti</span>
            </button>
        </div>
    </header>

    <!-- Main Mobile Content Area -->
    <main class="flex-1 px-3.5 py-4 w-full">

        <!-- LANGKAH 1: PILIH NAMA PENGGUNA (HP VIEW) -->
        <section id="step1UserSelection" class="animate-fade-in space-y-4 py-2">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-5 text-white text-center shadow-lg">
                <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-2 backdrop-blur-sm">
                    <i class="fa-solid fa-id-badge text-amber-300"></i>
                </div>
                <h2 class="text-lg font-bold">Portal Inspeksi Toilet</h2>
                <p class="text-xs text-blue-100 mt-1">Inspeksi & Checklist Kondisi Toilet Toko</p>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-user-check text-blue-600"></i>
                    <span>Pilih Nama Anda (MTC/Officer)</span>
                </label>
                <div class="relative">
                    <select id="userOfficerSelect" onchange="confirmUserIdentity()" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-3.5 py-3 text-sm font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all appearance-none pr-10 cursor-pointer">
                        <option value="" disabled selected>-- SENTUH UNTUK PILIH NAMA --</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-400">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- LANGKAH 2 & 3: FORM INSPEKSI SATU PER SATU TOKO (MOBILE OPTIMIZED) -->
        <section id="stepAuditSingleStore" class="hidden animate-fade-in space-y-3.5">
            <!-- Progress Header HP -->
            <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-1.5">
                <div class="flex justify-between items-center text-[11px] font-bold">
                    <span id="stepOfficerBadge" class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded-md truncate max-w-[170px]">Officer: -</span>
                    <span id="stepProgressCounter" class="text-indigo-600 font-extrabold">Toko 1/1</span>
                </div>
                <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div id="progressBarFill" class="bg-gradient-to-r from-blue-600 to-indigo-600 h-full w-0 transition-all duration-300"></div>
                </div>
            </div>

            <!-- Card Utama Toko -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-4">
                <!-- Info Header Toko HP -->
                <div class="bg-slate-900 text-white rounded-xl p-3.5 shadow-md flex justify-between items-center border-l-4 border-amber-400">
                    <div class="min-w-0 flex-1 pr-2">
                        <div class="flex items-center gap-1.5">
                            <span id="currentStoreKdtk" class="bg-amber-400 text-slate-950 px-1.5 py-0.5 rounded font-black text-xs">KDTK</span>
                        </div>
                        <h2 id="currentStoreName" class="text-sm font-extrabold text-white mt-1 leading-tight truncate">NAMA TOKO</h2>
                    </div>
                    <div class="w-9 h-9 bg-white/10 rounded-lg flex items-center justify-center text-lg text-amber-300 shrink-0">
                        <i class="fa-solid fa-store"></i>
                    </div>
                </div>

                <form id="activeAuditForm" onsubmit="submitSingleStoreAudit(event)" class="space-y-4">
                    <!-- Items Checklist Toilet (8 Poin) -->
                    <div class="space-y-3" id="facilityChecklistContainer">
                        <!-- Checklist items injected dynamically -->
                    </div>

                    <!-- Catatan Umum Toko -->
                    <div class="pt-1">
                        <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1">Catatan/Temuan Umum (Opsional)</label>
                        <textarea id="formStoreNote" rows="2" placeholder="Catatan umum mengenai toilet toko ini..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                    </div>

                    <!-- Navigation Action Buttons for Mobile Thumb Area -->
                    <div class="flex gap-2 pt-1 sticky bottom-2 bg-white/95 p-2 rounded-xl shadow-lg border border-slate-200">
                        <button type="button" id="prevStoreBtn" onclick="navigateStore(-1)" class="w-1/3 py-3 bg-slate-100 active:bg-slate-200 text-slate-700 font-bold rounded-xl transition-all text-xs flex items-center justify-center gap-1">
                            <i class="fa-solid fa-chevron-left text-[10px]"></i>
                            <span>Kembali</span>
                        </button>
                        <button type="submit" id="nextStoreBtn" class="w-2/3 py-3 bg-emerald-600 active:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition-all text-xs flex items-center justify-center gap-1.5">
                            <span id="btnSubmitText">Simpan & Lanjut</span>
                            <i class="fa-solid fa-arrow-right text-[10px]"></i>
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <!-- HASIL AKHIR: SUMMARY SCREEN (HP VIEW) -->
        <section id="stepFinishSummary" class="hidden animate-fade-in space-y-4 py-3">
            <div class="bg-emerald-600 text-white rounded-2xl p-5 text-center shadow-md">
                <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-2xl mx-auto mb-2">
                    <i class="fa-solid fa-check text-white"></i>
                </div>
                <h2 class="text-lg font-extrabold">INSPEKSI SELESAI!</h2>
                <p class="text-xs text-emerald-100 mt-1">Semua toko tanggung jawab Anda telah tersimpan.</p>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="font-bold text-slate-800 text-xs uppercase tracking-wider border-b pb-2 flex items-center justify-between">
                    <span>Ringkasan Toko Saya</span>
                    <i class="fa-solid fa-list-check text-blue-600"></i>
                </h3>
                <div id="summaryStoreList" class="space-y-2">
                    <!-- Dynamic store summary list -->
                </div>
            </div>

            <button onclick="resetUserSelection()" class="w-full py-3.5 bg-slate-800 active:bg-slate-900 text-white font-bold text-xs rounded-xl shadow transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Selesai & Kembali ke Depan</span>
            </button>
        </section>

    </main>

    <!-- Footer Mobile -->
    <footer class="text-center py-3 text-[10px] text-slate-400 bg-white border-t border-slate-200">
        TOKO GETOL NATARU PERIODE 2026 &bull; MTC Checklist System
    </footer>

            { name: "CISANGKAN", kdtk: "TH79", officer: "UNASSIGNED (#N/A)" },
            { name: "BANDUNG CITY VIEW", kdtk: "TYZY", officer: "UNASSIGNED (#N/A)" }
        ];

        const CHECKLIST_ITEMS = [
            { id: "lantai", label: "Lantai, Dinding, dan Plafon", icon: "fa-border-all" },
            { id: "kloset", label: "Kloset, Urinoir, Ember, Gayung", icon: "fa-toilet" },
            { id: "saluran", label: "Saluran Pembuangan Air", icon: "fa-faucet-drip" },
            { id: "pintu", label: "Pintu Toilet", icon: "fa-door-closed" },
            { id: "gantungan", label: "Gantungan Pakaian", icon: "fa-shirt" },
            { id: "lampu", label: "Lampu Toilet", icon: "fa-lightbulb" },
            { id: "exhaust", label: "Exhaust Fan", icon: "fa-fan" },
            { id: "wastafel", label: "Wastafel Toilet", icon: "fa-sink" }
        ];

        let currentUser = null;
        let userStoresList = [];
        let currentStoreIndex = 0;
        let auditStoreData = {};

        window.onload = function() {
            populateUserDropdown();
            renderChecklistFormItems();
            loadSavedAudits();
        };

        function populateUserDropdown() {
            const officerList = Array.from(new Set(MASTER_MAPPING.map(item => item.officer))).sort();
            const select = document.getElementById('userOfficerSelect');
            select.innerHTML = '<option value="" disabled selected>-- SENTUH UNTUK PILIH NAMA --</option>';
            officerList.forEach(officer => {
                const opt = document.createElement('option');
                opt.value = officer;
                opt.textContent = officer;
                select.appendChild(opt);
            });
        }

        function loadSavedAudits() {
            const saved = localStorage.getItem('toko_getol_nataru_2026');
            if (saved) {
                try { auditStoreData = JSON.parse(saved); } catch(e) {}
            }
        }

        function saveAudits() {
            localStorage.setItem('toko_getol_nataru_2026', JSON.stringify(auditStoreData));
        }

        function confirmUserIdentity() {
            const name = document.getElementById('userOfficerSelect').value;
            if (!name) return;

            currentUser = name;
            userStoresList = MASTER_MAPPING.filter(item => item.officer === currentUser);
            currentStoreIndex = 0;

            document.getElementById('resetProfileBtn').classList.remove('hidden');
            document.getElementById('stepOfficerBadge').textContent = `MTC: ${currentUser}`;

            document.getElementById('step1UserSelection').classList.add('hidden');
            document.getElementById('stepFinishSummary').classList.add('hidden');
            document.getElementById('stepAuditSingleStore').classList.remove('hidden');

            renderCurrentStoreForm();
        }

        function resetUserSelection() {
            currentUser = null;
            userStoresList = [];
            currentStoreIndex = 0;
            document.getElementById('userOfficerSelect').value = "";
            document.getElementById('resetProfileBtn').classList.add('hidden');

            document.getElementById('step1UserSelection').classList.remove('hidden');
            document.getElementById('stepAuditSingleStore').classList.add('hidden');
            document.getElementById('stepFinishSummary').classList.add('hidden');
        }

        function renderCurrentStoreForm() {
            const totalStores = userStoresList.length;
            const currentStore = userStoresList[currentStoreIndex];

            // Progress Bar HP
            document.getElementById('stepProgressCounter').textContent = `Toko ${currentStoreIndex + 1}/${totalStores}`;
            const progressPercent = ((currentStoreIndex + 1) / totalStores) * 100;
            document.getElementById('progressBarFill').style.width = `${progressPercent}%`;

            // Display Toko Details
            document.getElementById('currentStoreKdtk').textContent = currentStore.kdtk;
            document.getElementById('currentStoreName').textContent = currentStore.name;

            // Load Existing Data if Any
            const existing = auditStoreData[currentStore.kdtk];
            CHECKLIST_ITEMS.forEach(item => {
                const val = existing ? (existing[item.id] || "OK") : "OK";
                const radio = document.querySelector(`input[name="form_${item.id}"][value="${val}"]`);
                if (radio) radio.checked = true;

                // Load Note per item if exists
                const noteInput = document.getElementById(`note_${item.id}`);
                if (noteInput) {
                    noteInput.value = existing ? (existing[`note_${item.id}`] || "") : "";
                }
            });
            document.getElementById('formStoreNote').value = existing?.note || "";

            // Navigation Buttons
            const prevBtn = document.getElementById('prevStoreBtn');
            if (currentStoreIndex === 0) {
                prevBtn.classList.add('opacity-40', 'pointer-events-none');
            } else {
                prevBtn.classList.remove('opacity-40', 'pointer-events-none');
            }

            const btnText = document.getElementById('btnSubmitText');
            if (currentStoreIndex === totalStores - 1) {
                btnText.textContent = "Simpan & Selesai";
            } else {
                btnText.textContent = "Simpan & Lanjut";
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderChecklistFormItems() {
            const container = document.getElementById('facilityChecklistContainer');
            container.innerHTML = "";

            CHECKLIST_ITEMS.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2.5";
                div.innerHTML = `
                    <div class="flex items-center gap-2 border-b border-slate-200/60 pb-1.5">
                        <div class="w-6 h-6 rounded bg-blue-100 text-blue-700 flex items-center justify-center text-xs shrink-0 font-bold">
                            <i class="fa-solid ${item.icon}"></i>
                        </div>
                        <span class="text-xs font-bold text-slate-800 leading-tight">${item.label}</span>
                    </div>

                    <!-- 3 Pilihan Jawaban HP Grid -->
                    <div class="grid grid-cols-3 gap-1.5 text-center">
                        <label class="cursor-pointer">
                            <input type="radio" name="form_${item.id}" value="OK" checked class="peer hidden">
                            <div class="p-2 rounded-lg border border-slate-300 text-[10px] font-bold text-slate-600 peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-600 shadow-sm transition-all">
                                BAGUS / OK
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="form_${item.id}" value="RUSAK" class="peer hidden">
                            <div class="p-2 rounded-lg border border-slate-300 text-[10px] font-bold text-slate-600 peer-checked:bg-rose-600 peer-checked:text-white peer-checked:border-rose-600 shadow-sm transition-all">
                                RUSAK
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="form_${item.id}" value="TIDAK_ADA" class="peer hidden">
                            <div class="p-2 rounded-lg border border-slate-300 text-[10px] font-bold text-slate-600 peer-checked:bg-amber-500 peer-checked:text-white peer-checked:border-amber-500 shadow-sm transition-all">
                                TIDAK ADA
                            </div>
                        </label>
                    </div>

                    <!-- Note Khusus Per Item -->
                    <div>
                        <input type="text" id="note_${item.id}" placeholder="Note khusus ${item.label.toLowerCase()}..." class="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-[11px] text-slate-700 focus:ring-1 focus:ring-blue-500 outline-none">
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function submitSingleStoreAudit(e) {
            e.preventDefault();
            const currentStore = userStoresList[currentStoreIndex];

            const payload = {
                officer: currentUser,
                storeName: currentStore.name,
                timestamp: new Date().toISOString(),
                note: document.getElementById('formStoreNote').value.trim()
            };

            CHECKLIST_ITEMS.forEach(item => {
                const selected = document.querySelector(`input[name="form_${item.id}"]:checked`);
                payload[item.id] = selected ? selected.value : "OK";

                const itemNote = document.getElementById(`note_${item.id}`)?.value.trim() || "";
                payload[`note_${item.id}`] = itemNote;
            });

            auditStoreData[currentStore.kdtk] = payload;
            saveAudits();

            if (currentStoreIndex < userStoresList.length - 1) {
                currentStoreIndex++;
                renderCurrentStoreForm();
            } else {
                showFinishSummary();
            }
        }

        function navigateStore(direction) {
            const target = currentStoreIndex + direction;
            if (target >= 0 && target < userStoresList.length) {
                currentStoreIndex = target;
                renderCurrentStoreForm();
            }
        }

        function showFinishSummary() {
            document.getElementById('stepAuditSingleStore').classList.add('hidden');
            document.getElementById('stepFinishSummary').classList.remove('hidden');

            const container = document.getElementById('summaryStoreList');
            container.innerHTML = "";

            userStoresList.forEach(st => {
                const data = auditStoreData[st.kdtk];
                let hasIssues = false;
                if (data) {
                    hasIssues = CHECKLIST_ITEMS.some(item => data[item.id] === 'RUSAK' || data[item.id] === 'TIDAK_ADA');
                }

                const div = document.createElement('div');
                div.className = "p-2.5 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-1";
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-slate-800 truncate">${st.name} (${st.kdtk})</span>
                        ${hasIssues 
                            ? `<span class="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.5 rounded font-extrabold">Ada Temuan</span>`
                            : `<span class="bg-emerald-100 text-emerald-800 text-[10px] px-1.5 py-0.5 rounded font-extrabold">Semua OK</span>`
                        }
                    </div>
                    ${data?.note ? `<p class="text-[10px] text-slate-500 italic">Note: "${data.note}"</p>` : ''}
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
